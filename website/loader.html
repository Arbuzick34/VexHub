<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#09090c">
  <title>VexHub Loader</title>
  <link rel="preload" href="assets/fonts/Roboto-Medium.ttf" as="font" type="font/ttf" crossorigin>
  <style>
    @font-face { font-family: "VexHub UI"; src: url("assets/fonts/Roboto-Medium.ttf") format("truetype"); font-weight: 400 800; font-style: normal; font-display: swap; }

    :root {
      color-scheme: dark;
      --bg: #09090c;
      --panel-a: #101016;
      --panel-b: #0b0b10;
      --sunken: #0a0a0e;
      --surface: #14141b;
      --surface-2: #1b1b23;
      --text: #f4f3f8;
      --soft: #d7d3df;
      --muted: #a09da9;
      --dim: #6f6b78;
      --faint: #4a4653;
      --line: rgba(255,255,255,.09);
      --line-soft: rgba(255,255,255,.06);
      --accent: #8b5cf6;
      --accent-bright: #a78bfa;
      --accent-soft: rgba(139,92,246,.14);
      --ok: #3ddc97;
      --danger: #f2555a;
      --mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
      --ease: cubic-bezier(.2,.7,.2,1);
      font-family: "VexHub UI", "Segoe UI", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(520px 260px at 50% -2%, rgba(139,92,246,.22), transparent 70%),
        radial-gradient(900px 420px at 50% 0%, rgba(88,60,190,.10), transparent 65%);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 68px 68px;
      -webkit-mask-image: radial-gradient(55% 45% at 50% 42%, #000 0%, transparent 78%);
      mask-image: radial-gradient(55% 45% at 50% 42%, #000 0%, transparent 78%);
    }
    ::selection { background: rgba(139,92,246,.4); color: #fff; }

    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon {
      width: 16px; height: 16px; flex: none;
      fill: none; stroke: currentColor;
      stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
    }

    .stage {
      position: relative;
      z-index: 1;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }

    /* ── window ─────────────────────────────────────────────── */
    .loader {
      position: relative;
      left: var(--tx, 0px);
      top: var(--ty, 0px);
      width: min(100%, 404px);
      border: 1px solid var(--line);
      border-radius: 16px;
      background:
        radial-gradient(120% 90% at 50% 0%, rgba(139,92,246,.09), transparent 55%),
        linear-gradient(180deg, var(--panel-a), var(--panel-b));
      box-shadow:
        0 40px 90px -30px rgba(0,0,0,.9),
        0 2px 6px rgba(0,0,0,.4),
        inset 0 1px 0 rgba(255,255,255,.055);
      animation: rise .5s var(--ease) both;
      transition: opacity .24s ease, transform .24s ease;
    }
    .loader::before {
      content: "";
      position: absolute;
      inset: -1px -1px auto;
      height: 1px;
      border-radius: 16px 16px 0 0;
      background: linear-gradient(90deg, transparent, rgba(167,139,250,.7), transparent);
      opacity: .55;
      pointer-events: none;
    }
    .loader.is-closed { opacity: 0; transform: scale(.965) translateY(8px); pointer-events: none; }
    .loader.dragging { transition: none; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); } }

    .titlebar {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 8px 0 13px;
      border-bottom: 1px solid var(--line-soft);
      background: rgba(255,255,255,.018);
      border-radius: 16px 16px 0 0;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    .titlebar:active { cursor: grabbing; }
    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .mark { width: 18px; height: 18px; flex: none; border-radius: 5px; box-shadow: 0 2px 8px -2px rgba(139,92,246,.8); }
    .brand-name { font-size: 11px; font-weight: 700; letter-spacing: .24em; color: var(--soft); }
    .version {
      font-family: var(--mono); font-size: 9px; letter-spacing: .04em; color: var(--dim);
      border: 1px solid var(--line-soft); border-radius: 5px; padding: 1px 5px; margin-left: 1px;
    }
    .lang {
      margin-left: 4px; padding: 0 0 0 9px;
      border: 0; border-left: 1px solid var(--line);
      background: none; color: var(--dim);
      font: 700 9px "VexHub UI", sans-serif; letter-spacing: .08em;
      cursor: pointer; transition: color .16s ease;
    }
    .lang:hover { color: var(--text); }

    .window-actions { display: flex; align-items: center; gap: 2px; }
    .win-btn {
      width: 26px; height: 26px; display: grid; place-items: center;
      border: 0; border-radius: 6px; background: none; color: var(--dim);
      cursor: pointer; transition: background .16s ease, color .16s ease;
    }
    .win-btn .icon { width: 13px; height: 13px; stroke-width: 1.8; }
    .win-btn:hover { background: rgba(255,255,255,.06); color: var(--text); }
    .win-btn--close:hover { background: rgba(242,85,90,.16); color: #ff9a9e; }

    .collapse { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .3s var(--ease); }
    .collapse-inner { min-height: 0; overflow: hidden; }
    .loader.is-min::before { opacity: 0; }
    .loader.is-min .collapse { grid-template-rows: 0fr; }
    .loader.is-min .titlebar { border-radius: 16px; border-bottom-color: transparent; }

    .payload {
      display: grid;
      gap: 12px;
      padding: 17px 17px 13px;
    }

    .intro { display: grid; gap: 4px; }
    .eyebrow {
      margin: 0;
      font-size: 9px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase;
      color: rgba(167,139,250,.82);
    }
    .intro h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }
    .intro p.lede { margin: 0; font-size: 11px; color: var(--dim); letter-spacing: .005em; }

    /* ── key field ──────────────────────────────────────────── */
    .field { display: grid; gap: 7px; }
    .field-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .field-head label { font-size: 11px; font-weight: 600; color: var(--muted); }
    .mini-link { font-size: 10.5px; color: var(--dim); text-decoration: none; transition: color .16s ease; }
    .mini-link:hover { color: var(--accent-bright); }

    .keybox {
      height: 44px;
      display: flex; align-items: center; gap: 9px;
      padding: 0 5px 0 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--sunken);
      box-shadow: inset 0 1px 2px rgba(0,0,0,.35);
      transition: border-color .16s ease, box-shadow .16s ease;
    }
    .keybox > .icon { color: var(--faint); transition: color .16s ease; }
    .keybox:focus-within { border-color: rgba(139,92,246,.62); box-shadow: 0 0 0 3px var(--accent-soft), inset 0 1px 2px rgba(0,0,0,.35); }
    .keybox:focus-within > .icon { color: var(--accent-bright); }
    .keybox.is-invalid { border-color: rgba(242,85,90,.62); box-shadow: 0 0 0 3px rgba(242,85,90,.12), inset 0 1px 2px rgba(0,0,0,.35); }
    .keybox.is-invalid > .icon { color: #ff8f93; }

    .keybox input {
      flex: 1; min-width: 0; height: 100%;
      border: 0; outline: 0; background: none;
      color: var(--text); caret-color: var(--accent-bright);
      font: 500 13px/1 var(--mono); letter-spacing: .1em;
    }
    .keybox input::placeholder { color: #45414d; letter-spacing: .12em; }
    .keybox input:disabled { color: var(--dim); -webkit-text-fill-color: var(--dim); }

    .paste {
      width: 30px; height: 30px; flex: none;
      display: grid; place-items: center;
      border: 0; border-radius: 7px; background: none; color: var(--dim);
      cursor: pointer; transition: background .16s ease, color .16s ease;
    }
    .paste .icon { width: 14px; height: 14px; }
    .paste:hover { background: rgba(255,255,255,.06); color: var(--text); }
    .paste:disabled { opacity: .4; cursor: default; }

    .error {
      display: flex; align-items: flex-start; gap: 6px;
      margin: 0; font-size: 10.5px; line-height: 1.35; color: #ff9a9e;
      animation: fade-in .18s ease both;
    }
    .error .icon { width: 12px; height: 12px; margin-top: 1px; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(-2px); } }

    .remember { display: flex; align-items: center; gap: 8px; margin-top: 1px; }
    .remember span { font-size: 10.5px; color: var(--dim); }
    .check {
      width: 16px; height: 16px; flex: none; padding: 0;
      display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,.18); border-radius: 5px;
      background: var(--sunken); color: transparent;
      cursor: pointer; transition: background .16s ease, border-color .16s ease, color .16s ease;
    }
    .check .icon { width: 11px; height: 11px; stroke-width: 2.4; }
    .check[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .check:hover { border-color: rgba(255,255,255,.32); }
    .check[aria-checked="true"]:hover { border-color: var(--accent-bright); background: var(--accent-bright); }

    /* ── session ────────────────────────────────────────────── */
    .status {
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      background: rgba(6,6,10,.42);
      overflow: hidden;
    }
    .status-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 11px;
      border-bottom: 1px solid var(--line-soft);
      font-size: 9px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
      color: var(--dim);
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 2px 7px 2px 6px;
      border: 1px solid var(--line-soft); border-radius: 999px;
      background: rgba(255,255,255,.02);
      font-family: var(--mono); font-size: 9px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted);
    }
    .badge i { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); transition: background .2s ease; }
    .status[data-state="running"] .badge { color: var(--accent-bright); border-color: rgba(139,92,246,.3); background: rgba(139,92,246,.08); }
    .status[data-state="running"] .badge i { background: var(--accent-bright); animation: pulse 1.4s ease-in-out infinite; }
    .status[data-state="active"] .badge { color: #9af0c9; border-color: rgba(61,220,151,.28); background: rgba(61,220,151,.07); }
    .status[data-state="active"] .badge i { background: var(--ok); box-shadow: 0 0 6px rgba(61,220,151,.7); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

    .steps { margin: 0; padding: 0; list-style: none; }
    .step {
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr) 16px;
      align-items: center;
      gap: 9px;
      min-height: 32px;
      padding: 5px 11px;
      transition: background .2s ease;
    }
    .step + .step { border-top: 1px solid rgba(255,255,255,.045); }
    .step-icon { position: relative; width: 16px; height: 16px; display: grid; place-items: center; color: var(--faint); transition: color .2s ease; }
    .step-icon .icon { width: 15px; height: 15px; }
    .step-copy { display: grid; gap: 1px; min-width: 0; }
    .step-copy strong { font-size: 11px; font-weight: 600; color: #8f8b98; letter-spacing: .005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .2s ease; }
    .step-copy small { font-size: 9.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .2s ease; }
    .step-mark { width: 16px; height: 16px; display: grid; place-items: center; color: var(--faint); }
    .step-mark::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: .7; }
    .step-mark .icon { width: 12px; height: 12px; stroke-width: 2.4; }

    .step[data-state="active"] { background: rgba(139,92,246,.055); }
    .step[data-state="active"] .step-icon { color: var(--accent-bright); }
    .step[data-state="active"] .step-icon > .icon { opacity: 0; }
    .step[data-state="active"] .step-copy strong { color: var(--text); }
    .step[data-state="active"] .step-copy small { color: rgba(167,139,250,.85); }
    .step[data-state="active"] .step-mark::before { display: none; }

    .step[data-state="done"] .step-icon { color: var(--ok); }
    .step[data-state="done"] .step-copy strong { color: var(--soft); }
    .step[data-state="done"] .step-copy small { color: var(--dim); }
    .step[data-state="done"] .step-mark { color: var(--ok); }
    .step[data-state="done"] .step-mark::before { display: none; }

    .spin {
      position: absolute; inset: 1px;
      border: 1.5px solid rgba(167,139,250,.22);
      border-top-color: var(--accent-bright);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    .step-icon > .spin { display: none; }
    .step[data-state="active"] .step-icon > .spin { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .meter { padding: 9px 11px 11px; border-top: 1px solid var(--line-soft); }
    .meter-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
    .meter-head span:first-child { font-size: 10px; color: var(--muted); }
    .pct { font-family: var(--mono); font-size: 9.5px; color: var(--dim); }
    .bar {
      position: relative; height: 4px; border-radius: 999px; overflow: hidden;
      background: rgba(255,255,255,.06);
      box-shadow: inset 0 1px 1px rgba(0,0,0,.4);
    }
    .bar i {
      position: absolute; inset: 0 auto 0 0; width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #7c4dff, #a78bfa);
      box-shadow: 0 0 12px rgba(139,92,246,.55);
      transition: width .6s var(--ease), background .3s ease;
    }
    .status[data-state="running"] .bar i::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
      transform: translateX(-100%);
      animation: sweep 1.3s ease-in-out infinite;
    }
    .status[data-state="active"] .bar i { background: linear-gradient(90deg, #26b87a, #5eead4); box-shadow: 0 0 12px rgba(61,220,151,.5); }
    @keyframes sweep { to { transform: translateX(100%); } }

    /* ── launch ─────────────────────────────────────────────── */
    .launch {
      position: relative;
      width: 100%; height: 42px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid var(--accent); border-radius: 10px;
      background: linear-gradient(180deg, #9668f8, #7c4dff);
      color: #fff; font: 650 12.5px "VexHub UI", sans-serif; letter-spacing: .01em;
      cursor: pointer;
      box-shadow: 0 10px 26px -12px rgba(139,92,246,.9), inset 0 1px 0 rgba(255,255,255,.22);
      transition: background .16s ease, border-color .16s ease, transform .12s ease, box-shadow .16s ease, color .16s ease;
    }
    .launch .icon { width: 15px; height: 15px; }
    .launch:not(:disabled):hover { background: linear-gradient(180deg, #a175ff, #8b5cf6); transform: translateY(-1px); box-shadow: 0 14px 30px -12px rgba(139,92,246,1), inset 0 1px 0 rgba(255,255,255,.26); }
    .launch:not(:disabled):active { transform: translateY(0); }
    .launch:disabled {
      border-color: var(--line); background: rgba(255,255,255,.035); color: var(--faint);
      box-shadow: none; cursor: default;
    }
    .launch.is-busy:disabled {
      border-color: rgba(139,92,246,.35); background: rgba(139,92,246,.09); color: var(--accent-bright);
      cursor: progress;
    }
    .launch.is-busy .btn-spin { border-color: rgba(167,139,250,.28); border-top-color: var(--accent-bright); }
    .launch.is-secondary {
      border-color: rgba(255,255,255,.14); background: rgba(255,255,255,.04); color: var(--soft);
      box-shadow: none;
    }
    .launch.is-secondary:not(:disabled):hover {
      border-color: rgba(242,85,90,.45); background: rgba(242,85,90,.08); color: #ff9a9e;
      box-shadow: none; transform: none;
    }
    .btn-spin {
      width: 13px; height: 13px; flex: none;
      border: 1.6px solid rgba(255,255,255,.28);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    /* ── log ────────────────────────────────────────────────── */
    .log {
      border: 1px solid var(--line-soft); border-radius: 10px;
      background: rgba(4,4,7,.5);
      padding: 7px 9px 6px;
    }
    .log-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
    .log-head span { font-size: 8.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
    .log-head button {
      padding: 0; border: 0; background: none; color: var(--faint);
      font: 600 9px "VexHub UI", sans-serif; letter-spacing: .04em; cursor: pointer; transition: color .16s ease;
    }
    .log-head button:hover { color: var(--muted); }
    .lines {
      max-height: 42px; overflow-y: auto; overscroll-behavior: contain;
      font-family: var(--mono); font-size: 9.5px; line-height: 14px;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.14) transparent;
    }
    .lines::-webkit-scrollbar { width: 4px; }
    .lines::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 99px; }
    .lines .line { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 6px; animation: log-in .18s ease both; }
    .lines time { color: #4e4a56; }
    .lines p { margin: 0; color: #97929f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lines p em { color: var(--accent-bright); font-style: normal; }
    @keyframes log-in { from { opacity: 0; transform: translateY(-2px); } }

    /* ── footer ─────────────────────────────────────────────── */
    .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 1px 2px 0; }
    .online { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; color: var(--dim); }
    .online i { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 7px rgba(61,220,151,.7); animation: pulse 2.6s ease-in-out infinite; }
    .foot-links { display: flex; align-items: center; gap: 13px; }
    .foot-links a { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; color: var(--dim); text-decoration: none; transition: color .16s ease; }
    .foot-links a:hover { color: var(--soft); }
    .foot-links .icon { width: 11px; height: 11px; }

    .reopen {
      position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%);
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 16px;
      border: 1px solid var(--line); border-radius: 999px;
      background: rgba(17,17,22,.92); color: var(--soft);
      font: 600 11.5px "VexHub UI", sans-serif; letter-spacing: .02em;
      cursor: pointer; backdrop-filter: blur(12px);
      box-shadow: 0 18px 40px -18px rgba(0,0,0,.9);
      animation: rise .3s var(--ease) both;
    }
    .reopen:hover { border-color: rgba(255,255,255,.2); color: #fff; }
    .reopen .icon { width: 13px; height: 13px; }

    :focus-visible { outline: 2px solid rgba(167,139,250,.8); outline-offset: 2px; }
    .keybox input:focus-visible { outline: none; }

    @media (max-width: 440px) {
      .stage { padding: 14px 10px; }
      .payload { padding: 15px 14px 12px; gap: 11px; }
      .foot-links { gap: 10px; }
    }
    @media (max-height: 700px) {
      .stage { align-items: start; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
      .spin, .btn-spin { animation-duration: 1.4s !important; animation-iteration-count: infinite !important; }
    }
  </style>
</head>

  <script>
  (() => {
    "use strict";

    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));
    const STORE = { key: "vexhub.loader.key", remember: "vexhub.loader.remember", lang: "vexhub.loader.lang" };
    const KEY_RE = /^[0-9A-F]{4}(-[0-9A-F]{4}){3}$/;
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    const STEPS = [
      { id: "auth", icon: "i-key" },
      { id: "update", icon: "i-sync" },
      { id: "verify", icon: "i-shield" },
      { id: "game", icon: "i-target" },
      { id: "ready", icon: "i-plug" },
    ];
    const TARGETS = [12, 40, 68, 88, 100];
    const DURATIONS = [750, 1650, 1300, 950, 700];

    const DICT = {
      en: {
        "doc.title": "VexHub Loader",
        eyebrow: "VexHub loader",
        title: "Sign in to VexHub",
        lede: "External client · read-only · no injection",
        "key.label": "License key",
        "key.get": "Get a key",
        "key.paste": "Paste from clipboard",
        "key.invalid": "That key is not valid. Check the 16 characters and try again.",
        remember: "Remember this key on this PC",
        session: "Session",
        "badge.idle": "Idle",
        "badge.running": "Connecting",
        "badge.active": "Active",
        "step.auth.title": "Authenticate key",
        "step.auth.pending": "Queued",
        "step.auth.active": "Contacting gateway…",
        "step.auth.done": "Key accepted",
        "step.update.title": "Check for updates",
        "step.update.pending": "Queued",
        "step.update.active": "Reading manifest…",
        "step.update.done": "1.2.3 · up to date",
        "step.verify.title": "Verify client files",
        "step.verify.pending": "Queued",
        "step.verify.active": "Hashing 326 files…",
        "step.verify.done": "326 files signed",
        "step.game.title": "Locate Counter-Strike 2",
        "step.game.pending": "Queued",
        "step.game.active": "Scanning processes…",
        "step.game.done": "cs2.exe · pid 18024",
        "step.ready.title": "Prepare overlay",
        "step.ready.pending": "Queued",
        "step.ready.active": "Opening read-only handle…",
        "step.ready.done": "Ready · press Insert",
        "progress.idle": "Waiting for a key",
        "progress.ready": "Key ready",
        "progress.busy": "Setting up the session",
        "progress.done": "Session active",
        "launch.enter": "Enter your key",
        "launch.start": "Authenticate & launch",
        "launch.busy": "Connecting…",
        "launch.disconnect": "Disconnect",
        "log.title": "Session log",
        "log.clear": "Clear",
        "footer.online": "Servers online",
        "link.site": "Website",
        "link.source": "Source",
        "link.docs": "Docs",
        reopen: "Open loader",
        "aria.min": "Minimize",
        "aria.expand": "Expand",
        "aria.close": "Close",
        "aria.lang": "Switch language",
        "aria.session": "Session",
      },
      ru: {
        "doc.title": "Загрузчик VexHub",
        eyebrow: "Загрузчик VexHub",
        title: "Вход в VexHub",
        lede: "Внешний клиент · только чтение · без инъекций",
        "key.label": "Лицензионный ключ",
        "key.get": "Получить ключ",
        "key.paste": "Вставить из буфера",
        "key.invalid": "Неверный ключ. Проверьте 16 символов и попробуйте снова.",
        remember: "Запомнить ключ на этом устройстве",
        session: "Сессия",
        "badge.idle": "Ожидание",
        "badge.running": "Подключение",
        "badge.active": "Активна",
        "step.auth.title": "Проверка ключа",
        "step.auth.pending": "В очереди",
        "step.auth.active": "Связь со шлюзом…",
        "step.auth.done": "Ключ принят",
        "step.update.title": "Проверка обновлений",
        "step.update.pending": "В очереди",
        "step.update.active": "Чтение манифеста…",
        "step.update.done": "1.2.3 · актуально",
        "step.verify.title": "Проверка файлов клиента",
        "step.verify.pending": "В очереди",
        "step.verify.active": "Хеширование 326 файлов…",
        "step.verify.done": "326 файлов подписаны",
        "step.game.title": "Поиск Counter-Strike 2",
        "step.game.pending": "В очереди",
        "step.game.active": "Сканирование процессов…",
        "step.game.done": "cs2.exe · pid 18024",
        "step.ready.title": "Подготовка оверлея",
        "step.ready.pending": "В очереди",
        "step.ready.active": "Открытие handle только на чтение…",
        "step.ready.done": "Готово · нажмите Insert",
        "progress.idle": "Ожидание ключа",
        "progress.ready": "Ключ готов",
        "progress.busy": "Настройка сессии",
        "progress.done": "Сессия активна",
        "launch.enter": "Введите ключ",
        "launch.start": "Войти и запустить",
        "launch.busy": "Подключение…",
        "launch.disconnect": "Отключиться",
        "log.title": "Журнал сессии",
        "log.clear": "Очистить",
        "footer.online": "Серверы доступны",
        "link.site": "Сайт",
        "link.source": "Исходники",
        "link.docs": "Документация",
        reopen: "Открыть лоадер",
        "aria.min": "Свернуть",
        "aria.expand": "Развернуть",
        "aria.close": "Закрыть",
        "aria.lang": "Сменить язык",
        "aria.session": "Сессия",
      },
    };

    const els = {
      loader: $("#loader"),
      titlebar: $("#titlebar"),
      collapse: $(".collapse"),
      key: $("#key"),
      keybox: $("#keybox"),
      keyError: $("#key-error"),
      remember: $("#remember"),
      status: $("#status"),
      steps: $("#steps"),
      badge: $("#status .badge b"),
      progressLabel: $("#progress-label"),
      bar: $("#bar"),
      fill: $("#bar-fill"),
      pct: $("#pct"),
      launch: $("#launch"),
      launchText: $("#launch-text"),
      launchIcon: $("#launch-icon"),
      launchSpin: $("#launch-spin"),
      lines: $("#lines"),
      lang: $("#lang"),
      min: $("#min"),
      minIcon: $("#min-icon"),
      close: $("#close"),
      reopen: $("#reopen"),
      paste: $("#paste"),
      clear: $("#clear"),
    };

    const state = {
      lang: "en",
      phase: "idle",      // idle | busy | active
      step: -1,           // index of the running step
      done: 0,            // number of completed steps
      progress: 0,
      error: false,
      remember: false,
      token: 0,
    };

    const t = (key) => DICT[state.lang][key] ?? DICT.en[key] ?? key;
    const validKey = () => KEY_RE.test(els.key.value);
    const stepsHTML = () => STEPS.map((step) => `
      <li class="step" data-step="${step.id}" data-state="pending">
        <span class="step-icon"><svg class="icon"><use href="#${step.icon}"></use></svg><span class="spin" aria-hidden="true"></span></span>
        <span class="step-copy"><strong>${t(`step.${step.id}.title`)}</strong><small></small></span>
        <span class="step-mark" aria-hidden="true"></span>
      </li>`).join("");

    function stepState(index) {
      if (state.phase === "active") return "done";
      if (index < state.done) return "done";
      if (index === state.step) return "active";
      return "pending";
    }

    function render() {
      els.status.dataset.state = state.phase === "busy" ? "running" : state.phase === "active" ? "active" : "idle";
      els.badge.textContent = t(`badge.${state.phase === "busy" ? "running" : state.phase === "active" ? "active" : "idle"}`);

      els.steps.querySelectorAll(".step").forEach((li, index) => {
        const step = STEPS[index];
        const status = stepState(index);
        li.dataset.state = status;
        li.querySelector("small").textContent = t(`step.${step.id}.${status}`);
        li.querySelector(".step-mark").innerHTML = status === "done"
          ? '<svg class="icon"><use href="#i-check"></use></svg>'
          : "";
      });

      els.fill.style.width = `${state.progress}%`;
      els.bar.setAttribute("aria-valuenow", String(state.progress));
      els.pct.textContent = `${state.progress}%`;
      els.progressLabel.textContent =
        state.phase === "busy" ? t("progress.busy")
          : state.phase === "active" ? t("progress.done")
            : validKey() ? t("progress.ready") : t("progress.idle");

      const busy = state.phase === "busy";
      const active = state.phase === "active";
      els.launch.disabled = busy || (!active && !validKey());
      els.launch.classList.toggle("is-secondary", active);
      els.launchSpin.hidden = !busy;
      els.launchIcon.toggleAttribute("hidden", busy);
      els.launch.classList.toggle("is-busy", busy);
      els.key.disabled = state.phase !== "idle";
      els.paste.disabled = state.phase !== "idle";

      if (busy) {
        els.launchText.textContent = t("launch.busy");
      } else if (active) {
        els.launchText.textContent = t("launch.disconnect");
        els.launchIcon.firstElementChild.setAttribute("href", "#i-power");
      } else if (validKey()) {
        els.launchText.textContent = t("launch.start");
        els.launchIcon.firstElementChild.setAttribute("href", "#i-play");
      } else {
        els.launchText.textContent = t("launch.enter");
        els.launchIcon.firstElementChild.setAttribute("href", "#i-lock");
      }
    }

    function log(text) {
      const now = new Date().toLocaleTimeString("en-GB", { hour12: false });
      const line = document.createElement("div");
      line.className = "line";
      const time = document.createElement("time");
      time.textContent = now;
      const message = document.createElement("p");
      message.textContent = text;
      line.append(time, message);
      els.lines.append(line);
      while (els.lines.children.length > 60) els.lines.firstElementChild.remove();
      els.lines.scrollTop = els.lines.scrollHeight;
    }

    function clearError() {
      state.error = false;
      els.keyError.hidden = true;
      els.keybox.classList.remove("is-invalid");
      els.key.removeAttribute("aria-invalid");
    }

    function showError(focus = false) {
      state.error = true;
      els.keyError.querySelector("span").textContent = t("key.invalid");
      els.keyError.hidden = false;
      els.keybox.classList.add("is-invalid");
      els.key.setAttribute("aria-invalid", "true");
      if (focus) els.key.focus();
      log("key rejected · malformed input");
    }

    function formatKey(raw) {
      const digits = raw.replace(/[^0-9a-z]/gi, "").toUpperCase().slice(0, 16);
      return digits.replace(/(.{4})(?=.)/g, "$1-");
    }

    function caretFor(digits) {
      if (digits <= 0) return 0;
      return Math.min(digits + Math.floor((digits - 1) / 4), els.key.value.length);
    }

    function onKeyInput() {
      const caret = els.key.selectionStart ?? els.key.value.length;
      const digitsBefore = els.key.value.slice(0, caret).replace(/[^0-9a-z]/gi, "").length;
      els.key.value = formatKey(els.key.value);
      const next = caretFor(digitsBefore);
      els.key.setSelectionRange(next, next);
      clearError();
      persistKey();
      render();
    }

    function persistKey() {
      try {
        if (state.remember) localStorage.setItem(STORE.key, els.key.value);
        else localStorage.removeItem(STORE.key);
      } catch { /* storage can be unavailable in private mode */ }
    }

    function setRemember(value) {
      state.remember = value;
      els.remember.setAttribute("aria-checked", String(value));
      try { localStorage.setItem(STORE.remember, value ? "1" : "0"); } catch { /* ignore */ }
      persistKey();
    }

    async function start() {
      if (state.phase !== "idle" || !validKey()) {
        if (!validKey()) showError(true);
        return;
      }

      clearError();
      state.phase = "busy";
      state.progress = 0;
      state.done = 0;
      state.step = 0;
      state.token += 1;
      const token = state.token;
      render();
      log("key verified · gateway 24 ms");

      const lines = [
        "manifest 1.2.3+build.418 · up to date",
        "integrity ok · 326 files signed",
        "cs2.exe found · pid 18024",
        "read-only handle open · overlay ready",
      ];

      for (let i = 0; i < STEPS.length; i += 1) {
        if (token !== state.token) return;
        state.step = i;
        state.progress = i === 0 ? 4 : TARGETS[i - 1];
        render();
        await sleep(DURATIONS[i]);
        if (token !== state.token) return;
        state.done = i + 1;
        state.progress = TARGETS[i];
        if (i > 0) log(lines[i - 1]);
        render();
        await sleep(120);
      }

      if (token !== state.token) return;
      state.phase = "active";
      state.step = -1;
      state.progress = 100;
      render();
      log("session active · press Insert to open the menu");
    }

    function disconnect() {
      state.token += 1;
      state.phase = "idle";
      state.step = -1;
      state.done = 0;
      state.progress = 0;
      render();
      log("session closed by user");
    }

    function applyLanguage(lang) {
      state.lang = lang;
      document.documentElement.lang = lang;
      document.title = t("doc.title");
      els.lang.textContent = lang === "en" ? "RU" : "EN";
      els.lang.setAttribute("aria-label", t("aria.lang"));
      els.min.setAttribute("aria-label", els.loader.classList.contains("is-min") ? t("aria.expand") : t("aria.min"));
      els.close.setAttribute("aria-label", t("aria.close"));
      els.paste.setAttribute("aria-label", t("key.paste"));
      els.status.setAttribute("aria-label", t("aria.session"));
      els.lines.closest(".log").setAttribute("aria-label", t("log.title"));
      $$("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
      els.steps.innerHTML = stepsHTML();
      if (state.error) els.keyError.querySelector("span").textContent = t("key.invalid");
      render();
      try { localStorage.setItem(STORE.lang, lang); } catch { /* ignore */ }
    }

    // ── events ──────────────────────────────────────────────
    els.key.addEventListener("input", onKeyInput);
    els.key.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      if (!validKey()) showError(true);
      else if (state.phase === "idle") start();
    });
    els.key.addEventListener("blur", () => {
      if (els.key.value && !validKey()) showError();
    });

    els.launch.addEventListener("click", () => {
      if (state.phase === "active") disconnect();
      else start();
    });

    els.remember.addEventListener("click", () => setRemember(!state.remember));

    els.paste.addEventListener("click", async () => {
      try {
        const text = await navigator.clipboard.readText();
        els.key.value = formatKey(text);
        els.key.focus();
        const end = els.key.value.length;
        els.key.setSelectionRange(end, end);
        clearError();
        persistKey();
        render();
      } catch {
        els.key.focus();
        log("clipboard blocked by the browser · press Ctrl+V");
      }
    });

    els.clear.addEventListener("click", () => { els.lines.innerHTML = ""; });

    els.lang.addEventListener("click", () => applyLanguage(state.lang === "en" ? "ru" : "en"));

    els.min.addEventListener("click", () => {
      const minimized = els.loader.classList.toggle("is-min");
      els.min.setAttribute("aria-expanded", String(!minimized));
      els.min.setAttribute("aria-label", minimized ? t("aria.expand") : t("aria.min"));
      els.minIcon.setAttribute("href", minimized ? "#i-expand" : "#i-minus");
    });

    els.close.addEventListener("click", () => {
      els.loader.classList.add("is-closed");
      els.reopen.hidden = false;
      log("window hidden · session state preserved");
    });

    els.reopen.addEventListener("click", () => {
      els.loader.classList.remove("is-closed");
      els.reopen.hidden = true;
      els.key.focus();
    });

    // Window dragging, constrained to the viewport.
    let drag = null;
    els.titlebar.addEventListener("pointerdown", (event) => {
      if (event.target.closest("button")) return;
      const rect = els.loader.getBoundingClientRect();
      drag = {
        pointer: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        x: parseFloat(getComputedStyle(els.loader).getPropertyValue("--tx")) || 0,
        y: parseFloat(getComputedStyle(els.loader).getPropertyValue("--ty")) || 0,
        minX: 8 - rect.left,
        maxX: window.innerWidth - 8 - rect.right,
        minY: 8 - rect.top,
        maxY: window.innerHeight - 8 - rect.bottom,
      };
      els.loader.classList.add("dragging");
      els.titlebar.setPointerCapture(event.pointerId);
    });
    els.titlebar.addEventListener("pointermove", (event) => {
      if (!drag) return;
      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
      const x = clamp(drag.x + event.clientX - drag.startX, drag.minX, drag.maxX);
      const y = clamp(drag.y + event.clientY - drag.startY, drag.minY, drag.maxY);
      els.loader.style.setProperty("--tx", `${x}px`);
      els.loader.style.setProperty("--ty", `${y}px`);
    });
    const endDrag = () => { drag = null; els.loader.classList.remove("dragging"); };
    els.titlebar.addEventListener("pointerup", endDrag);
    els.titlebar.addEventListener("pointercancel", endDrag);

    // ── boot ────────────────────────────────────────────────
    (() => {
      let lang = "en";
      try {
        const stored = localStorage.getItem(STORE.lang);
        const wanted = stored || (navigator.language || "").toLowerCase();
        lang = (wanted === "ru" || wanted.startsWith("ru-") || (stored === "ru")) ? "ru" : "en";
        const remembered = localStorage.getItem(STORE.remember) === "1";
        const savedKey = localStorage.getItem(STORE.key);
        state.remember = remembered;
        els.remember.setAttribute("aria-checked", String(remembered));
        if (remembered && savedKey) {
          els.key.value = formatKey(savedKey);
          if (!validKey()) els.key.value = "";
        }
      } catch { /* storage can be unavailable */ }

      applyLanguage(lang);
      log("loader 1.2.3 · win64");
      log("gateway reachable · 24 ms");
      render();
    })();
  })();
  </script>
</body>
</html>
